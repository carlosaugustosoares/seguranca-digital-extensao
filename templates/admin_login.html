<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área administrativa</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container"><section class="card login"><div class="icon">🔒</div><h1>Área administrativa</h1><p class="subtitle">Digite a senha para acessar o dashboard.</p>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="alert">{{ m }}</div>{% endfor %}{% endwith %}<form method="POST"><label for="senha">Senha</label><input class="input" id="senha" name="senha" type="password" required><button class="button" type="submit">Entrar</button></form><a class="text-link" href="{{ url_for('inicio') }}">Voltar ao quiz</a></section></main></body></html>
