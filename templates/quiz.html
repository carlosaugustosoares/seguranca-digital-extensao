<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container"><section class="card"><h1>🔐 Quiz de Segurança Digital</h1><p class="subtitle">Escolha uma alternativa para cada pergunta.</p><form action="{{ url_for('enviar') }}" method="POST">{% for p in perguntas %}<div class="question"><h2>{{ p.id }}. {{ p.texto }}</h2>{% for op in p.opcoes %}<label class="option"><input type="radio" name="pergunta_{{ p.id }}" value="{{ loop.index0 }}" required><span>{{ op }}</span></label>{% endfor %}</div>{% endfor %}<button class="button" type="submit">Finalizar quiz</button></form></section></main></body></html>
